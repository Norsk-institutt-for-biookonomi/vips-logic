version: "3.9"

services:
  vipslogicdb:
    image: postgis/postgis:16-3.4
    container_name: vipslogicdb
    environment:
      POSTGRES_DB: vipslogic
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: foobar
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vipslogic -d vipslogic"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - dbdata:/var/lib/postgresql/data
  vipslogic:
    build:
      context: ..
      dockerfile: VIPSLogic/Dockerfile
    container_name: vipslogic
    depends_on:
      vipslogicdb:
        condition: service_healthy
    environment:
      # Java options including debug configuration
      JAVA_OPTS: >-
        -Xms4g
        -Xmx16g
        -XX:+UseG1GC
        -XX:MaxGCPauseMillis=200
        -XX:+UseStringDeduplication
        -Dno.nibio.vips.logic.MESSAGE_ILLUSTRATION_PATH=/data/messages
        -Dno.nibio.vips.logic.OBSERVATION_ILLUSTRATION_PATH=/data/observations
        -Dno.nibio.vips.logic.START_SCHEDULING_ON_BOOT=false
        -Djboss.bind.address=0.0.0.0
        -Djboss.bind.address.management=0.0.0.0
        -agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=*:5005
    ports:
      - "8080:8080"
      - "9990:9990"
      - "5005:5005"
    volumes:
      - appdata:/data

volumes:
  dbdata:
  appdata: