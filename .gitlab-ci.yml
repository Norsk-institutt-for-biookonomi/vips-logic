# Quarkus VIPSLogic — build, test, Docker image, deploy to Quarkic staging/production.
# Pattern aligned with vips-weather-proxy and VIPSCore.

image: docker:27.4.1

stages:
  - test
  - build
  - deploy

services:
  - docker:27.4.1-dind

variables:
  COMMON_CONFIG_REMOTE: https://oauth2:$CICD_ACCESS_TOKEN@$CI_SERVER_HOST/VIPS/vips-common-config.git
  COMMON_CONFIG_LOCAL: vips-common-config
  SETTINGS_XML: ci_settings.xml
  MAVEN_CLI_OPTS: "-s $SETTINGS_XML --batch-mode"
  MAVEN_OPTS: "-Dmaven.repo.local=.m2/repository -Dmaven.artifact.threads=10"
  TAG_NAME: "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA"
  STAGING_SERVER_HOST: vipslogicapp02test.nibio.no
  PRODUCTION_SERVER_HOST: vipslogicapp02.nibio.no
  QUARKIC_COMPOSE_FILE: docker-compose-staging.yml
  DEPLOY_BRANCH: develop
  DOCKER_DRIVER: overlay2
  DOCKER_TLS_CERTDIR: /certs
  DOCKER_HOST: tcp://docker:2376
  DOCKER_TLS_VERIFY: 1
  DOCKER_CERT_PATH: /certs/client

cache:
  paths:
    - .m2/repository/

.maven_before_script: &maven_before_script
  - apk add --no-cache openjdk17 maven git
  - java -version
  - mvn -version
  - git config --global user.name "${GITLAB_USER_NAME}"
  - git config --global user.email "${GITLAB_USER_EMAIL}"
  - echo "Get common Maven settings"
  - git clone --depth=1 "$COMMON_CONFIG_REMOTE" "$COMMON_CONFIG_LOCAL"
  - cp "$COMMON_CONFIG_LOCAL/$SETTINGS_XML" .
  - rm -rf "$COMMON_CONFIG_LOCAL"

test:
  stage: test
  image: docker:27.4.1
  before_script:
    - apk add --no-cache openjdk17 maven git
    - git config --global user.name "${GITLAB_USER_NAME}"
    - git config --global user.email "${GITLAB_USER_EMAIL}"
    - echo "Get common Maven settings"
    - git clone --depth=1 "$COMMON_CONFIG_REMOTE" "$COMMON_CONFIG_LOCAL"
    - cp "$COMMON_CONFIG_LOCAL/$SETTINGS_XML" .
    - rm -rf "$COMMON_CONFIG_LOCAL"
  script:
    - mvn $MAVEN_CLI_OPTS $MAVEN_OPTS test
  tags:
    - java
  rules:
    - if: '$CI_COMMIT_REF_NAME == $DEPLOY_BRANCH'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'

build-docker:
  stage: build
  before_script:
    - apk add --no-cache openjdk17 maven git
    - *maven_before_script
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" "$CI_REGISTRY" --password-stdin
  script:
    - mvn $MAVEN_CLI_OPTS $MAVEN_OPTS package -DskipTests
    - docker build -t "$TAG_NAME" -f Dockerfile .
    - docker push "$TAG_NAME"
  after_script:
    - docker logout "$CI_REGISTRY" || true
  tags:
    - java
  rules:
    - if: '$CI_COMMIT_REF_NAME == $DEPLOY_BRANCH && $CI_PIPELINE_SOURCE != "merge_request_event"'

.deploy_quarkic:
  stage: deploy
  services: []
  variables:
    DOCKER_TLS_CERTDIR: ""
    DOCKER_TLS_VERIFY: ""
    DOCKER_CERT_PATH: ""
  before_script:
    - apk add --no-cache docker-cli-compose openssh-client
    - install -m 700 -d ~/.ssh
    - echo "$SSH_PRIVATE_KEY" | tr -d '\r' > ~/.ssh/id_ci
    - chmod 600 ~/.ssh/id_ci
    # IdentitiesOnly without IdentityFile ignores ssh-agent keys; Docker over SSH needs an explicit key file.
    - |
      printf 'Host %s\n\tIdentityFile ~/.ssh/id_ci\n\tIdentitiesOnly yes\n\tStrictHostKeyChecking no\n' \
        "$DEPLOY_SERVER_HOST" > ~/.ssh/config
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" "$CI_REGISTRY" --password-stdin
  script:
    - export TAG_NAME="$CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA"
    - docker compose -f "$QUARKIC_COMPOSE_FILE" pull
    - docker compose -f "$QUARKIC_COMPOSE_FILE" up -d --remove-orphans
    - docker compose -f "$QUARKIC_COMPOSE_FILE" ps
  after_script:
    - docker logout "$CI_REGISTRY" || true
  tags:
    - java
  needs:
    - build-docker
  rules:
    - if: '$CI_COMMIT_REF_NAME == $DEPLOY_BRANCH && $CI_PIPELINE_SOURCE != "merge_request_event"'
  when: manual

deploy-staging:
  extends: .deploy_quarkic
  variables:
    DEPLOY_SERVER_HOST: $STAGING_SERVER_HOST
    DOCKER_HOST: "ssh://$SERVER_USER@$STAGING_SERVER_HOST"
    VIPSLOGIC_PROTOCOL: https
    PROTOCOL: https
    VIPSLOGIC_SERVER_NAME: logic.testvips.nibio.no
    SERVER_NAME: logic.testvips.nibio.no
  environment:
    name: quarkic-staging
    url: https://quarkic.testvips.nibio.no
  resource_group: quarkic-staging

deploy-production:
  extends: .deploy_quarkic
  variables:
    DEPLOY_SERVER_HOST: $PRODUCTION_SERVER_HOST
    DOCKER_HOST: "ssh://$SERVER_USER@$PRODUCTION_SERVER_HOST"
    VIPSLOGIC_PROTOCOL: https
    PROTOCOL: https
    VIPSLOGIC_SERVER_NAME: logic.vips.nibio.no
    SERVER_NAME: logic.vips.nibio.no
  environment:
    name: quarkic-production
    url: https://logic.vips.nibio.no
  resource_group: quarkic-production
