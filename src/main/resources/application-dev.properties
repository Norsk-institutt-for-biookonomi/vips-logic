# Local dev profile matches docker-compose vipslogicdb defaults
%dev.quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5432/vipslogic
%dev.quarkus.datasource.username=${VIPSLOGIC_DB_USER:vipslogic}
%dev.quarkus.datasource.password=${VIPSLOGIC_DB_PASSWORD:}
%dev.vipslogic.scheduling.start-on-boot=false
%dev.vipslogic.md5-salt=${VIPSLOGIC_MD5_SALT:local-dev-salt-change-me}
%dev.vipslogic.server-name=localhost:8080
%dev.no.nibio.vips.logic.messaging.dist.SIMULATE_MAIL_SENDING=true
%dev.quarkus.mailer.mock=true
