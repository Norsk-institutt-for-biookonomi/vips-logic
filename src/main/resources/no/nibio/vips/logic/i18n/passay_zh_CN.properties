ILLEGAL_CHAR=\u5bc6\u7801\u542b\u6709\u975e\u6cd5\u5b57\u7b26 '%1$s'.
ALLOWED_CHAR=\u5bc6\u7801\u542b\u6709\u975e\u6cd5\u5b57\u7b26 '%1$s'.
