# Quarkus migration Phase 1 skeleton

quarkus.application.name=VIPSLogic

# HTTP
quarkus.http.port=8080

# Datasource override via env in Docker/CI (no secrets in git)
quarkus.datasource.db-kind=postgresql
quarkus.datasource.jdbc.url=${VIPSLOGIC_DB_URL:jdbc:postgresql://localhost:5432/vipslogic}
quarkus.datasource.username=${VIPSLOGIC_DB_USER:postgres}
quarkus.datasource.password=${VIPSLOGIC_DB_PASSWORD:}

# Flyway (legacy table name matches WildFly StartupListener)
quarkus.flyway.migrate-at-start=true
quarkus.flyway.table=schema_version
quarkus.flyway.locations=classpath:db/migration

# Hibernate ORM schema managed by Flyway, not auto-generated
quarkus.hibernate-orm.persistence-xml.ignore=true
quarkus.hibernate-orm.schema-management.strategy=none
quarkus.hibernate-orm.dialect=org.hibernate.spatial.dialect.postgis.PostgisPG10Dialect
quarkus.hibernate-orm.log.sql=false

# Health
quarkus.smallrye-health.root-path=/q/health

# Business beans/REST are WildFly-era — exclude from CDI until Phase 2/3 migration
quarkus.arc.exclude-types=no.nibio.vips.logic.controller.**,no.nibio.vips.logic.service.**,no.nibio.vips.logic.modules.**,no.nibio.vips.logic.messaging.**,no.nibio.vips.logic.authenticate.**,no.nibio.vips.logic.scheduling.**,no.nibio.vips.logic.startup.**,no.nibio.vips.observationdata.**,no.nibio.web.**
