# Quarkus migration Phase 1 skeleton

quarkus.application.name=VIPSLogic

# HTTP
quarkus.http.port=8080
quarkus.http.enable-compression=true
quarkus.rest.path=/rest

# Datasource override via env in Docker/CI (no secrets in git)
quarkus.datasource.db-kind=postgresql
quarkus.datasource.jdbc.url=${VIPSLOGIC_DB_URL:jdbc:postgresql://localhost:5432/vipslogic}
quarkus.datasource.username=${VIPSLOGIC_DB_USER:postgres}
quarkus.datasource.password=${VIPSLOGIC_DB_PASSWORD:}

# Flyway (legacy table name matches WildFly StartupListener)
quarkus.flyway.migrate-at-start=true
quarkus.flyway.table=schema_version
quarkus.flyway.locations=classpath:db/migration

# Hibernate ORM schema managed by Flyway, not auto-generated
quarkus.hibernate-orm.persistence-xml.ignore=true
quarkus.hibernate-orm.schema-management.strategy=none
quarkus.hibernate-orm.dialect=org.hibernate.spatial.dialect.postgis.PostgisPG10Dialect
quarkus.hibernate-orm.log.sql=false

# Health
quarkus.smallrye-health.root-path=/q/health

# OpenAPI / Swagger UI (replaces Enunciate)
quarkus.smallrye-openapi.path=/q/openapi
quarkus.swagger-ui.path=/q/swagger-ui
quarkus.swagger-ui.always-include=true
mp.openapi.extensions.smallrye.info.title=VIPSLogic REST API
mp.openapi.extensions.smallrye.info.version=2026.1

# App URLs (legacy system property names still supported via env/-D)
vipslogic.protocol=${no.nibio.vips.logic.VIPSLOGIC_PROTOCOL:http}
vipslogic.server-name=${no.nibio.vips.logic.SERVER_NAME:logic.vips.nibio.no}
vipslogic.md5-salt=${VIPSLOGIC_MD5_SALT:local-dev-salt-change-me}

# Outbound universal messaging service (Phase 3.10 — not injected in app code yet)
quarkus.rest-client.universal-messaging.url=${VIPSLOGIC_UNIVERSAL_MESSAGING_URL:http://localhost:8080}

# VIPSCommon
quarkus.index-dependency.vipscommon.group-id=no.nibio.vips
quarkus.index-dependency.vipscommon.artifact-id=VIPSCommon

# Scheduling (replaces WildFly START_SCHEDULING_ON_BOOT system property)
quarkus.scheduler.enabled=true
# Pure programmatic scheduling via SchedulingBean — no @Scheduled methods
quarkus.scheduler.start-mode=forced
vipslogic.scheduling.start-on-boot=${no.nibio.vips.logic.START_SCHEDULING_ON_BOOT:false}

# Messaging (legacy system property names still supported via env/-D)
no.nibio.vips.logic.USER_COUNTRY_CODES=${VIPSLOGIC_USER_COUNTRY_CODES:NO,SE,BA,LV,US,FI,LT,CH}
no.nibio.vips.logic.DISABLE_MESSAGING_SYSTEM=${VIPSLOGIC_DISABLE_MESSAGING:false}
no.nibio.vips.logic.SMTP_SERVER=${VIPSLOGIC_SMTP_SERVER:localhost}
no.nibio.vips.logic.messaging.dist.SIMULATE_MAIL_SENDING=${VIPSLOGIC_SIMULATE_MAIL_SENDING:true}
no.nibio.vips.logic.messaging.dist.MAIL_SENDER_ADDRESS=${VIPSLOGIC_MAIL_SENDER_ADDRESS:noreply@localhost}
no.nibio.vips.logic.messaging.dist.SMS_SERVER=${VIPSLOGIC_SMS_SERVER:}
no.nibio.vips.logic.messaging.dist.SMS_USERNAME=${VIPSLOGIC_SMS_USERNAME:}
no.nibio.vips.logic.messaging.dist.SMS_PASSWORD=${VIPSLOGIC_SMS_PASSWORD:}
no.nibio.vips.logic.messaging.dist.SMS_SENDER_SRC=${VIPSLOGIC_SMS_SENDER_SRC:}
no.nibio.vips.logic.messaging.dist.TRAFFIC_LOG_DIRECTORY=${VIPSLOGIC_TRAFFIC_LOG_DIRECTORY:/tmp/vipslogic-traffic}
vipslogic.messaging.sms.webhook.username=${VIPSLOGIC_SMS_WEBHOOK_USERNAME:vianett}
vipslogic.messaging.sms.webhook.password=${VIPSLOGIC_SMS_WEBHOOK_PASSWORD:plantevern2016}

quarkus.mailer.host=${no.nibio.vips.logic.SMTP_SERVER}
quarkus.mailer.from=${no.nibio.vips.logic.messaging.dist.MAIL_SENDER_ADDRESS}
quarkus.mailer.mock=${no.nibio.vips.logic.messaging.dist.SIMULATE_MAIL_SENDING}

# Servlet UI enabled via quarkus-undertow + web.xml (Phase 6)
quarkus.arc.exclude-types=no.nibio.web.**

# FreeMarker admin UI templates must not be parsed as Qute templates
quarkus.qute.template-path-exclude=.*\\.ftl
