services:
  vipslogic-quarkus:
    image: ${TAG_NAME}
    container_name: vipslogic-quarkus
    restart: always
    ports:
      - "18080:8080"
    environment:
      # Quarkus DB env vars (application.properties)
      VIPSLOGIC_DB_URL: ${VIPSLOGIC_DB_URL:-}
      VIPSLOGIC_DB_USER: ${VIPSLOGIC_DB_USER:-}
      VIPSLOGIC_DB_PASSWORD: ${VIPSLOGIC_DB_PASSWORD:-}
      # Quarkic hostname overrides (may use VIPSLOGIC_* or unprefixed GitLab keys)
      VIPSLOGIC_PROTOCOL: ${VIPSLOGIC_PROTOCOL:-${PROTOCOL:-}}
      VIPSLOGIC_SERVER_NAME: ${VIPSLOGIC_SERVER_NAME:-${SERVER_NAME:-}}
      # Legacy WildFly GitLab variable names → container env for entrypoint.sh
      VIPSLOGIC_MD5_SALT: ${MD5_SALT:-}
      VIPSLOGIC_GOOGLE_OPENID_CLIENT_ID: ${GOOGLE_OPENID_CLIENT_ID:-}
      VIPSLOGIC_GOOGLE_OPENID_CLIENT_SECRET: ${GOOGLE_OPENID_CLIENT_SECRET:-}
      VIPSLOGIC_START_SCHEDULING_ON_BOOT: ${START_SCHEDULING_ON_BOOT:-}
      VIPSLOGIC_DISABLE_MESSAGING: ${DISABLE_MESSAGING_SYSTEM:-}
      VIPSLOGIC_MESSAGE_ILLUSTRATION_PATH: ${MESSAGE_ILLUSTRATION_PATH:-}
      VIPSLOGIC_OBSERVATION_ILLUSTRATION_PATH: ${OBSERVATION_ILLUSTRATION_PATH:-}
      VIPSLOGIC_WEATHER_PROXY_BASE_URL: ${VIPS_WEATHER_PROXY_BASE_URL:-}
      VIPSLOGIC_FIELDCLIMATE_API_USERNAME: ${FIELDCLIMATE_API_USERNAME:-}
      VIPSLOGIC_FIELDCLIMATE_API_PASSWORD: ${FIELDCLIMATE_API_PASSWORD:-}
      VIPSLOGIC_FIELDCLIMATE_API_CLIENT_ID: ${FIELDCLIMATE_API_CLIENT_ID:-}
      VIPSLOGIC_FIELDCLIMATE_API_CLIENT_SECRET: ${FIELDCLIMATE_API_CLIENT_SECRET:-}
      VIPSLOGIC_RIMPROXVEN_USERNAME: ${RIMPROXVEN_USERNAME:-}
      VIPSLOGIC_RIMPROXVEN_PASSWORD: ${RIMPROXVEN_PASSWORD:-}
      VIPSLOGIC_SYSTEM_TIME_OFFSET_MONTHS: ${SYSTEM_TIME_OFFSET_MONTHS:-}
      VIPSLOGIC_AVAILABLE_LANGUAGES: ${AVAILABLE_LANGUAGES:-}
      VIPSLOGIC_AVAILABLE_TIMEZONES: ${AVAILABLE_TIMEZONES:-}
      VIPSLOGIC_USER_COUNTRY_CODES: ${USER_COUNTRY_CODES:-}
      VIPSLOGIC_ALLOWED_X_DOMAINS: ${ALLOWED_X_DOMAINS:-}
      VIPSLOGIC_SMTP_SERVER: ${SMTP_SERVER:-}
      VIPSLOGIC_SIMULATE_MAIL_SENDING: ${SIMULATE_MAIL_SENDING:-}
      VIPSLOGIC_MAIL_SENDER_ADDRESS: ${MAIL_SENDER_ADDRESS:-}
      VIPSLOGIC_SMS_SERVER: ${SMS_SERVER:-}
      VIPSLOGIC_SMS_USERNAME: ${SMS_USERNAME:-}
      VIPSLOGIC_SMS_PASSWORD: ${SMS_PASSWORD:-}
      VIPSLOGIC_SMS_SENDER_SRC: ${SMS_SENDER_SRC:-}
      VIPSLOGIC_TRAFFIC_LOG_DIRECTORY: ${TRAFFIC_LOG_DIRECTORY:-}
      JAVA_OPTS_APPEND: "-Xms512m -Xmx4096m"
    volumes:
      - /disks/data01/static/images/messages:/disks/data01/static/images/messages:ro
      - /disks/data01/static/images/observations:/disks/data01/static/images/observations:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/q/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s
